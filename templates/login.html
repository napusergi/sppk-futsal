{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
 <div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h2 mb-1">Masuk</h1>
  <p class="text-muted small">Sistem Pendukung Keputusan Posisi Futsal (AHP + TOPSIS)</p>
  <form method="post">
   <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus></div>
   <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" required></div>
   <button class="btn btn-court w-100">Masuk</button>
  </form>
  <p class="small mt-3 mb-0">Belum punya akun? <a href="{{ url_for('register') }}">Buat akun</a>. Akun baru aktif setelah disetujui Super Admin.</p>
 </div></div>
</div></div>
{% endblock %}
